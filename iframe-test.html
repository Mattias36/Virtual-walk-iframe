<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test osadzenia aplikacji</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, sans-serif;
            background: #101612;
            color: #f3f7f4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            padding: 20px;
            background: radial-gradient(circle at top, #1c3a2b, #101612 58%);
        }

        .page {
            width: min(100%, 1280px);
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
        }

        h1 {
            margin: 0;
            font-size: clamp(20px, 3vw, 30px);
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        button {
            border: 1px solid #5a8d70;
            border-radius: 8px;
            padding: 9px 12px;
            background: #1b4c32;
            color: inherit;
            cursor: pointer;
            font: inherit;
        }

        button:hover {
            background: #286b46;
        }

        .frame {
            width: 100%;
            height: min(650px, calc(100dvh - 100px));
            min-height: 620px;
            margin: 0 auto;
            padding: 8px;
            /* border: 1px solid #46765a; */
            border-radius: 12px;
            background: transparent;
            transition: max-width 0.2s ease;
        }

        .frame.narrow {
            max-width: 530px;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 6px;
            background: transparent;
        }

        @media (max-width: 600px) {
            body {
                padding: 8px;
            }

            header {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .frame {
                height: calc(100dvh - 104px);
                min-height: 0;
                padding: 4px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <header>
            <h1>Test aplikacji w iframe</h1>
            <div class="actions">
                <button type="button" id="reload">Przeladuj</button>
                <button type="button" id="toggle-width">Waska szerokosc</button>
            </div>
        </header>

        <section class="frame" id="frame" aria-label="Kontener iframe">
            <iframe src="./index.html" title="Osadzona aplikacja BlockView"></iframe>
        </section>
    </main>

    <script>
        const frame = document.getElementById('frame');
        const iframe = frame.querySelector('iframe');
        const reloadButton = document.getElementById('reload');
        const widthButton = document.getElementById('toggle-width');

        reloadButton.addEventListener('click', () => {
            iframe.src = iframe.src;
        });

        widthButton.addEventListener('click', () => {
            frame.classList.toggle('narrow');
            widthButton.textContent = frame.classList.contains('narrow')
                ? 'Pelna szerokosc'
                : 'Waska szerokosc';
        });
    </script>
</body>

</html>
